{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <link rel="stylesheet" href="{% static 'employee/style.css' %}">
</head>

<body>

    <div class="main-content form-page">

        <div class="form-container">

            <h2>Update Employee</h2>
            <p>Modify the employee details below.</p>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <label>Employee Name</label>
                <input type="text" name="name"
                       value="{{ employee.name }}" required>

                <label>Email</label>
                <input type="email" name="email"
                       value="{{ employee.email }}" required>

                <label>Position</label>
                <input type="text" name="position"
                       value="{{ employee.position }}" required>

                <label>Department</label>
                <input type="text" name="department"
                       value="{{ employee.department }}" required>

                <label>Date Joined</label>
                <input type="date" name="date_joined"
                       value="{{ employee.date_joined|date:'Y-m-d' }}" required>

                <label>Photo</label>
                {% if employee.photo %}
                    <img src="{{ employee.photo.url }}" alt="Current photo"
                         style="width:80px;height:80px;object-fit:cover;border-radius:50%;display:block;margin-bottom:8px;">
                {% endif %}
                <input type="file" name="photo" accept="image/*">

                <div class="form-buttons">

                    <button type="submit" class="add-btn">
                        Update Employee
                    </button>

                    <a href="{% url 'home' %}" class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
