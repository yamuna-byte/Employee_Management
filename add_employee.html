{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>
    <link rel="stylesheet" href="{% static 'employee/style.css' %}">
</head>

<body>

    <div class="main-content form-page">

        <div class="form-container">

            <h2>Add New Employee</h2>
            <p>Enter the employee details below.</p>

            <form method="POST">

                {% csrf_token %}

                <label>Employee Name</label>
                <input type="text" name="name" placeholder="Enter employee name" required>

                <label>Email</label>
                <input type="email" name="email" placeholder="Enter email address" required>

                <label>Position</label>
                <input type="text" name="position" placeholder="Enter position" required>

                <label>Department</label>
                <input type="text" name="department" placeholder="Enter department" required>

                <label>Date Joined</label>
                <input type="date" name="date_joined" required>

                <div class="form-buttons">
                    <button type="submit" class="add-btn">Save Employee</button>

                    <a href="{% url 'home' %}" class="cancel-btn">Cancel</a>
                </div>

            </form>

        </div>

    </div>

</body>
</html>
